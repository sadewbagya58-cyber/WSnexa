  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      width: 100%;
      background-color: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(1.5rem + env(safe-area-inset-top, 0px)) 1.5rem calc(1.5rem + env(safe-area-inset-bottom, 0px));
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      text-align: center;
      overflow: hidden;
    }
    .card {
      max-width: 360px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }
    .logo-badge {
      width: 76px;
      height: 76px;
      border-radius: 22px;
      background-color: #18181b;
      border: 1px solid #27272a;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px -8px rgba(0, 0, 0, 0.6);
    }
    .logo-badge img {
      width: 52px;
      height: 52px;
      object-fit: contain;
    }
    .title {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: -0.025em;
      color: #ffffff;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      background-color: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fbbf24;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 9999px;
      background-color: #f59e0b;
    }
    .description {
      font-size: 0.875rem;
      line-height: 1.5;
      color: #a1a1aa;
    }
    .btn {
      width: 100%;
      min-height: 48px;
      border-radius: 14px;
      background-color: #fafafa;
      color: #09090b;
      font-size: 0.875rem;
      font-weight: 800;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.15s ease;
      touch-manipulation: manipulation;
    }
    .btn:active {
      transform: scale(0.98);
      background-color: #e4e4e7;
    }
    .footer {
      font-size: 0.75rem;
      color: #52525b;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

    <div>
      <h1 class="title">WSNexa</h1>
      <div class="status-badge" style="margin-top: 0.5rem;">
        <span class="status-dot"></span>
        <span>Offline Mode</span>
      </div>
    </div>

    <p class="description">
      WSNexa is currently offline. Your active session is preserved. The app will automatically reconnect as soon as network is restored.
    </p>

    <button class="btn" id="retryBtn" onclick="checkAndReconnect()">
      <span>Reconnect Now</span>
    </button>

    <div class="footer">
      Hospitality Operating System · Installed Client
    </div>
  </div>

  <script>
    const TARGET_URL = 'https://w-snexa.vercel.app';

    function checkAndReconnect() {
      const btn = document.getElementById('retryBtn');
      btn.innerHTML = 'Connecting...';
      btn.style.opacity = '0.7';

      fetch(TARGET_URL + '/api/health', { mode: 'no-cors', cache: 'no-store' })
        .then(() => {
          window.location.href = TARGET_URL;
        })
        .catch(() => {
          if (navigator.onLine) {
            window.location.href = TARGET_URL;
          } else {
            setTimeout(() => {
              btn.innerHTML = 'Reconnect Now';
              btn.style.opacity = '1';
            }, 1000);
          }
        });
    }

    window.addEventListener('online', () => {
      window.location.href = TARGET_URL;
    });

    setInterval(() => {
      if (navigator.onLine) {
        fetch(TARGET_URL + '/api/health', { mode: 'no-cors', cache: 'no-store' })
          .then(() => { window.location.href = TARGET_URL; })
          .catch(() => {});
      }
    }, 4000);
  </script>
