<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <title>WSNexa — Offline</title>
  <link rel="icon" type="image/png" href="./assets/ws-mark.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      height: 100%;
      width: 100%;
      background-color: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(2rem + env(safe-area-inset-top, 0px)) 1.5rem calc(2rem + env(safe-area-inset-bottom, 0px));
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      text-align: center;
    }
    .card {
      max-width: 360px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }
    .logo-badge {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background-color: #18181b;
      border: 1px solid #27272a;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .logo-badge img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }
    .title {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: -0.025em;
      color: #ffffff;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      background-color: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fbbf24;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 9999px;
      background-color: #f59e0b;
    }
    .description {
      font-size: 0.875rem;
      line-height: 1.5;
      color: #a1a1aa;
    }
    .btn {
      width: 100%;
      min-height: 48px;
      border-radius: 14px;
      background-color: #fafafa;
      color: #09090b;
      font-size: 0.875rem;
      font-weight: 800;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.15s ease;
      touch-manipulation: manipulation;
    }
    .btn:active {
      transform: scale(0.98);
      background-color: #e4e4e7;
    }
    .footer-note {
      font-size: 0.75rem;
      color: #71717a;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-badge">
      <img src="./assets/ws-mark.png" alt="WSNexa" />
    </div>

    <div>
      <h1 class="title">WSNexa</h1>
      <p style="font-size: 0.75rem; color: #71717a; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.25rem;">
        Hospitality Operating System
      </p>
    </div>

    <div class="status-badge">
      <span class="status-dot"></span>
      <span>Offline Mode</span>
    </div>

    <p class="description">
      WSNexa is waiting for an active internet connection to load your venue workspace. Please check your Wi-Fi or mobile data.
    </p>

    <button id="retryBtn" class="btn">
      <span>Reconnect Now</span>
    </button>

    <p class="footer-note" id="autoRetryText">Auto-reconnecting when internet is restored...</p>
  </div>

  <script>
    var targetUrl = 'https://w-snexa.vercel.app';

    function tryReconnect() {
      var btn = document.getElementById('retryBtn');
      if (btn) {
        btn.innerText = 'Connecting...';
        btn.disabled = true;
      }
      window.location.href = targetUrl;
      setTimeout(function() {
        if (btn) {
          btn.innerText = 'Reconnect Now';
          btn.disabled = false;
        }
      }, 4000);
    }

    var btn = document.getElementById('retryBtn');
    if (btn) {
      btn.addEventListener('click', tryReconnect);
    }
    window.addEventListener('online', tryReconnect);
  </script>
</body>
</html>
